<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>次元守卫 · 动画预览</title><style>
@font-face{font-family:GuardTitle;src:url(assets/title.ttf)}*{box-sizing:border-box}body{margin:0;background:#10232d;color:#eee8d8;font:15px/1.6 'Microsoft YaHei',sans-serif}main{max-width:1320px;margin:auto;padding:24px}h1{font:30px GuardTitle,sans-serif;color:#efd9aa;margin:0 0 10px}p{margin:0 0 16px;color:#bfceca}a{color:#f0d18c}nav{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:18px 0}select,button{font:inherit;background:#29434e;color:#eee8d8;border:1px solid #859a9e;border-radius:6px;padding:8px 12px}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f1d68f;outline-offset:3px}.stage{position:relative;border:1px solid #68848b;border-radius:9px;overflow:hidden}canvas{width:100%;display:block}.labels{position:absolute;inset:0;pointer-events:none;display:grid}.labels span{display:flex;justify-content:center;align-items:flex-end;padding-bottom:16px;color:#d5d9c7;font-size:13px}.footnote{margin:14px 0;color:#acc4c1;font-size:13px}.status{color:#f0d39a}.effects{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.effect{text-align:center;background:#203843;border-radius:8px;padding:12px}.effect canvas{height:132px;object-fit:contain}.effect p{margin:4px 0 0;font-size:13px}label{display:flex;gap:6px;align-items:center}@media(max-width:650px){main{padding:16px}.effects{grid-template-columns:repeat(2,1fr)}h1{font-size:25px}nav{gap:8px}}
</style></head><body><main><h1>八方向动作预览</h1><p>使用游戏中的实际图集、脚底锚点和角色绘制代码。<a href="./">返回游戏</a></p><nav><select id="actor" aria-label="角色"></select><select id="state" aria-label="动作"><option value="walk">行走 / 飞行</option><option value="idle">待机</option><option value="attack">攻击</option><option value="hurt">受击</option><option value="death">战败</option></select><select id="speed" aria-label="预览速度"><option value="0.5">0.5× 慢放</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select><button id="pause">暂停</button><label><input type="checkbox" id="baseline" checked>显示落脚线</label></nav><p class="status" id="status">正在读取动画……</p><div class="stage"><canvas id="preview"></canvas><div class="labels"></div></div><p class="footnote">方向切换保留动作相位。部分反向视角使用合格素材镜像；攻击、受击和战败继续使用对应的多状态素材。行走为八帧循环。</p><div class="effects"></div><div id="error" role="alert"></div></main><script type="module" src="animation-review.js"></script></body></html>
